name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest
      - name: Smoke-test CLI entry points
        run: |
          python -m governed_signal_to_content --help
          gs2c --help
      - name: Validate archival metadata syntax
        run: |
          python -c "import json; json.load(open('.zenodo.json', encoding='utf-8'))"
          python -c "import yaml; yaml.safe_load(open('CITATION.cff', encoding='utf-8'))"
